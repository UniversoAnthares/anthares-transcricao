name: Anthares Public Runner Probe
on:
  push:
    paths:
      - '.github/workflows/anthares-public-runner-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public hosted runner
        run: |
          echo PUBLIC_RUNNER_OK
          test -e /dev/kvm && echo KVM_AVAILABLE || echo KVM_MISSING
